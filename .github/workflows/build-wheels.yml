name: Build wheels

# Self-contained Fields2Cover wheels via cibuildwheel (see pyproject.toml
# [tool.cibuildwheel] + packaging/ci/). OR-Tools is a runtime peer-dependency;
# the slim GDAL/GEOS/PROJ stack is built by vcpkg in the per-platform before-all
# and bundled by the repair step.
#
# Phase 1: macOS arm64 only. Phases 2/3 add manylinux x86_64 and macOS x86_64
# (commented matrix rows below). Phase 4 wires publishing to GitHub Releases.

on:
  workflow_dispatch:
  push:
    branches: ["wheel-**"]

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, macos_target: "11.0" }
          # Phase 3: - { name: macos-x86_64, os: macos-13, macos_target: "13.0" }
          # Phase 2: - { name: manylinux-x86_64, os: ubuntu-latest }
    env:
      # Drives both the vcpkg build (via the overlay triplet) and the cibuildwheel
      # wheel build, so bundled libs and the wheel share a deployment target.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@v4

      # Cache vcpkg's built binary packages so re-runs skip the ~20-40 min
      # from-source GDAL/PROJ/GEOS build. Keyed on the manifest + triplets; the
      # post-step saves even on failure, so partial builds carry forward.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'packaging/ci/triplets/*') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Spike: build a single Python version first for a fast green, then
          # drop this override to build the full cp39–cp313 set from pyproject.
          CIBW_BUILD: "cp312-*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
