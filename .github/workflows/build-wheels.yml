name: Build wheels

# Self-contained Fields2Cover wheels via cibuildwheel (see pyproject.toml
# [tool.cibuildwheel] + packaging/ci/). OR-Tools is a runtime peer-dependency;
# the slim GDAL/GEOS/PROJ stack is built by vcpkg in the per-platform before-all
# and bundled by the repair step.
#
# Two jobs:
#   build — cibuildwheel builds + repairs the wheels (test SKIPPED here) and
#           ALWAYS uploads them as artifacts. So every run leaves downloadable
#           wheels, even if the tests then fail.
#   test  — downloads a platform's wheels and runs the smoke + full tests/python
#           suite per Python version. Fast (no rebuild): iterate on tests without
#           paying the ~20-min vcpkg build, and debug the actual built wheel.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload wheels to PyPI? (0: no, 1: yes)'
        required: true
        default: '0'
  push:
    branches: ["wheel-**"]

# cancel running jobs on new commit to PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` drives the job display name; `name` is the stable slug used for
          # cache keys + artifact names. cache_path is set only where vcpkg caching
          # works today (macOS runs on the host); Linux runs in a container whose
          # writes don't persist to the host, so its vcpkg cache is disabled until a
          # host bind-mount is wired up (deferred). Rows without cache_path skip the
          # cache steps.
          - { name: macos-arm64,       arch: arm64,   os: macos-14,        macos_target: "11.0",  cache_path: "~/.cache/vcpkg/archives" }
          - { name: manylinux-x86_64,  arch: x86_64,  os: ubuntu-latest }
          - { name: manylinux-aarch64, arch: aarch64, os: ubuntu-24.04-arm }
          # macOS x86_64 (Intel) dropped: GitHub's free Intel (macos-13) runners are
          # scarce/deprecated and stalled the queue, blocking every test job. Intel
          # users use source install / Rosetta. Re-add a macos-13 row here + in the
          # test matrix if the runner situation improves (recipe already supports x86_64).
    env:
      # macOS only: drives the vcpkg build (via overlay triplet) and the wheel
      # build so bundled libs and the wheel share a deployment target. Empty (and
      # harmless) on the Linux rows.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@v6

      # Cache vcpkg's built binary packages so re-runs skip the ~20-min from-source
      # GDAL/PROJ/GEOS build. Split restore/save (save if: always()) so the build
      # is cached even when the run fails. restore-keys falls back to the newest
      # prior cache for this platform. Guarded on cache_path (macOS-only today).
      - name: Restore vcpkg cache
        id: vcpkg-cache
        if: matrix.cache_path
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.cache_path }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'packaging/ci/triplets/*') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Tests run in the separate `test` job (against the uploaded artifact) so
          # a test failure never blocks the wheel from being uploaded/debuggable.
          CIBW_TEST_SKIP: "*"

      - name: Save vcpkg cache
        if: always() && matrix.cache_path && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.cache_path }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'packaging/ci/triplets/*') }}

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    name: Test ${{ matrix.platform.arch }} py${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        platform:
          - { name: macos-arm64,       arch: arm64,   os: macos-14 }
          - { name: manylinux-x86_64,  arch: x86_64,  os: ubuntu-latest }
          - { name: manylinux-aarch64, arch: aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6      # tests/python + packaging/ci/smoke.py + data/
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v5
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist
      - name: Install the built wheel + test deps
        shell: bash
        run: |
          set -euo pipefail
          cp="cp$(echo '${{ matrix.python }}' | tr -d '.')"
          whl=$(ls dist/fields2cover-*-"${cp}"-*.whl)
          echo "Installing $whl"
          python -m pip install --upgrade pip
          python -m pip install "${whl}[test]"
      - name: Smoke + pytest
        shell: bash
        run: |
          set -euo pipefail
          python packaging/ci/smoke.py
          python -m pytest tests/python -q
