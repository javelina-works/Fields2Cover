name: Build wheels

# Self-contained Fields2Cover wheels via cibuildwheel (see pyproject.toml
# [tool.cibuildwheel] + packaging/ci/). OR-Tools is a runtime peer-dependency;
# the slim GDAL/GEOS/PROJ stack is built by vcpkg in the per-platform before-all
# and bundled by the repair step.
#
# Phase 1: macOS arm64 only. Phases 2/3 add manylinux x86_64 and macOS x86_64
# (commented matrix rows below). Phase 4 wires publishing to GitHub Releases.

on:
  workflow_dispatch:
  push:
    branches: ["wheel-**"]

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,       os: macos-14,       macos_target: "11.0", cache_path: "~/.cache/vcpkg/archives" }
          - { name: manylinux-x86_64,  os: ubuntu-latest,                        cache_path: ".vcpkg-bincache" }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm,                     cache_path: ".vcpkg-bincache" }
          # Phase 3: - { name: macos-x86_64, os: macos-15, macos_target: "13.0", cache_path: "~/.cache/vcpkg/archives" }
    env:
      # macOS only: drives the vcpkg build (via overlay triplet) and the wheel
      # build so bundled libs and the wheel share a deployment target. Empty (and
      # harmless) on the Linux rows.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@v4

      # Cache vcpkg's built binary packages so re-runs skip the ~20-40 min
      # from-source GDAL/PROJ/GEOS build. macOS uses vcpkg's default archives dir;
      # Linux redirects the cache under the (bind-mounted) project so it persists
      # out of the container. Post-step saves even on failure.
      # Split restore/save so the ~20-min vcpkg build is cached even when the run
      # FAILS (a single actions/cache step only saves on job success, so failing
      # debug iterations would otherwise rebuild the whole GDAL/PROJ/GEOS stack
      # every time). restore-keys falls back to the newest prior cache for this
      # platform, so a vcpkg.json change rebuilds only the per-package delta.
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.cache_path }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'packaging/ci/triplets/*') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Spike: build a single Python version first for a fast green, then
          # drop this override to build the full cp39–cp313 set from pyproject.
          CIBW_BUILD: "cp312-*"

      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.cache_path }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'packaging/ci/triplets/*') }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
