name: Build wheels

# Self-contained Fields2Cover wheels via cibuildwheel (see pyproject.toml
# [tool.cibuildwheel] + packaging/ci/). OR-Tools is a runtime peer-dependency;
# the slim GDAL/GEOS/PROJ stack is built by vcpkg in the per-platform before-all
# and bundled by the repair step.
#
# Phase 1: macOS arm64 only. Phases 2/3 add manylinux x86_64 and macOS x86_64
# (commented matrix rows below). Phase 4 wires publishing to GitHub Releases.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload wheels to PyPI? (0: no, 1: yes)'
        required: true
        default: '0'
  push:
    branches: ["wheel-**"]

# cancel running jobs on new commit to PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Build ${{ matrix.arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` drives the job display name; `name` is the stable slug used for
          # cache keys + artifact names. cache_path is set only where vcpkg caching
          # works today (macOS runs on the host); Linux runs in a container whose
          # writes don't persist to the host, so its vcpkg cache is disabled until a
          # host bind-mount is wired up (deferred). Rows without cache_path skip the
          # cache steps.
          - { name: macos-arm64,       arch: arm64,   os: macos-14,        macos_target: "11.0",  cache_path: "~/.cache/vcpkg/archives" }
          # Intel Macs: macos-13 is the (free) Intel runner (macos-14/15 are arm64).
          # Deployment target 10.15 matches OR-Tools' x86_64 macOS wheel floor
          # (macosx_10_15), so pip can install the ortools peer-dep alongside our wheel.
          - { name: macos-x86_64,      arch: x86_64,  os: macos-13,        macos_target: "10.15", cache_path: "~/.cache/vcpkg/archives" }
          - { name: manylinux-x86_64,  arch: x86_64,  os: ubuntu-latest }
          - { name: manylinux-aarch64, arch: aarch64, os: ubuntu-24.04-arm }
    env:
      # macOS only: drives the vcpkg build (via overlay triplet) and the wheel
      # build so bundled libs and the wheel share a deployment target. Empty (and
      # harmless) on the Linux rows.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@v6

      # Cache vcpkg's built binary packages so re-runs skip the ~20-min from-source
      # GDAL/PROJ/GEOS build. Split restore/save (with save if: always()) so the
      # build is cached even when the run FAILS — a single actions/cache step only
      # saves on job success, so failing debug iterations would otherwise rebuild
      # the whole stack every time. restore-keys falls back to the newest prior
      # cache for this platform, so a vcpkg.json change rebuilds only the delta.
      # Guarded on cache_path (macOS-only today — see the matrix note).
      - name: Restore vcpkg cache
        id: vcpkg-cache
        if: matrix.cache_path
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.cache_path }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'packaging/ci/triplets/*') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        # Builds the full cp39–cp313 set per platform (from pyproject
        # [tool.cibuildwheel].build). vcpkg builds once per platform in before-all;
        # each Python version then just recompiles the F2C extension + runs the
        # smoke test (which now hard-fails if OR-Tools genRoute regresses).

      - name: Save vcpkg cache
        if: always() && matrix.cache_path && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.cache_path }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'packaging/ci/triplets/*') }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
