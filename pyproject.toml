# Root PEP 517 build for the Fields2Cover Python wheel.
#
# Replaces the legacy "CMake copies the .so into site-packages via setup.py"
# flow with scikit-build-core, so `pip wheel .` / `uv pip install .` drive the
# CMake build and assemble a real wheel. See swig/python/CMakeLists.txt for the
# SKBUILD-guarded package layout, and _local/ for the packaging plan.
[build-system]
requires = [
  "scikit-build-core>=0.10", 
  "swig>=4.0", 
  "ninja>=1.5"
]
build-backend = "scikit_build_core.build"

[project]
name = "fields2cover"
version = "2.1.0"
description = "Robust and efficient coverage paths for autonomous agricultural vehicles"
readme = "README.rst"
license = { file = "LICENSE" }
authors = [
  { name = "Wageningen University", email = "gonzalo.miermunoz@wur.nl" }
]
keywords = ["coverage path planning", "agriculture", "robotics", "fields2cover"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
]

requires-python = ">=3.9"
# Option A (thin wheel): reuse OR-Tools' coherent build from the official pip
# wheel at runtime instead of bundling it. F2C is ABI-welded to this exact
# version's bundled abseil/protobuf, so the pin must be exact — see _local/.
dependencies = [
  "ortools==9.15.6755"
]

[project.urls]
Documentation = "https://fields2cover.github.io/"
Repository = "https://github.com/Fields2Cover/Fields2Cover"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/skbuild/{wheel_tag}"
wheel.license-files = ["LICENSE"]

# Native deps (GDAL, OR-Tools, GEOS, ...) are discovered from the system via
# CMAKE_PREFIX_PATH, which is read from the ENVIRONMENT rather than hardcoded
# here, so the same build works on a dev machine and in CI. CMake reads the
# `CMAKE_PREFIX_PATH` env var as a ':'-separated list on Unix (note: ':' here,
# unlike the ';'-separated cmake -D define). Set it per context:
#   - Local macOS/Homebrew:  export CMAKE_PREFIX_PATH="$(brew --prefix)"
#     (also export LIBRARY_PATH / CPATH for the hardcoded `-lgeos_c` — see _local/).
#   - OR-Tools peer-dep build: prepend the extracted OR-Tools tarball and set
#     `ortools_DIR` so find_package(ortools CONFIG) resolves it (see _local/).
#   - CI (cibuildwheel): the per-platform before-all sets CMAKE_PREFIX_PATH.
[tool.scikit-build.cmake.define]
BUILD_PYTHON = "ON"
BUILD_TUTORIALS = "OFF"
BUILD_TESTING = "OFF"
BUILD_DOC = "OFF"
ALLOW_PARALLELIZATION = "OFF"

# ---------------------------------------------------------------------------
# cibuildwheel: build self-contained wheels in CI. See packaging/ci/ (per-
# platform before-all scripts) and .github/workflows/build-wheels.yml.
#
# Strategy: OR-Tools stays a runtime PEER-DEPENDENCY on every platform — the pip
# `ortools` wheel (pinned above) supplies its libs at import via the
# @loader_path/../ortools/.libs rpath, so the repair step EXCLUDES the OR-Tools
# closure. Only the slim GDAL/GEOS/PROJ stack (provisioned by the before-all via
# vcpkg — see vcpkg.json) is bundled into the wheel.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux*"
build-verbosity = 1
# Import gate + OR-Tools routing smoke (genRoute) in the isolated test venv. The
# wheel's own `ortools==` dep is installed there, so the peer-dep rpath resolves.
test-command = "python {project}/packaging/ci/smoke.py"

[tool.cibuildwheel.macos]
before-all = "bash {project}/packaging/ci/before_all_macos.sh {project}"
# Bundle the slim GDAL/GEOS/PROJ closure (incl. shared libz/libbz2 they need) but
# EXCLUDE the entire OR-Tools closure (the 241 dylibs the tarball ships:
# libortools[_flatzinc], abseil, protobuf[-lite]/protoc, re2, utf8_*, scip,
# soplex, highs, and the CoinOR set Cbc*/Cgl/Clp*/CoinUtils/Osi*) — those resolve
# at runtime from the pip `ortools` wheel via @loader_path/../ortools/.libs.
# --sanitize-rpaths drops the absolute vcpkg/OR-Tools rpaths (added below so
# delocate can resolve @rpath deps) from the shipped binaries; @loader_path
# entries are preserved.
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} --sanitize-rpaths -e libortools -e libabsl -e libprotobuf -e libprotoc -e libre2 -e libutf8 -e libscip -e libsoplex -e libhighs -e libCbc -e libCgl -e libClp -e libCoinUtils -e libOsi -w {dest_dir} -v {wheel}"

# Stable paths created by before_all_macos.sh (":"-separated env-form paths).
# CMAKE_PREFIX_PATH + LIBRARY_PATH/CPATH let CMake find the deps and satisfy the
# hardcoded `-lgeos_c`. CMAKE_INSTALL_RPATH_USE_LINK_PATH puts the vcpkg + OR-Tools
# lib dirs on the built binaries' rpath so delocate can RESOLVE every @rpath dep
# at repair time (macOS SIP strips DYLD_* across the shell, so rpath is the
# reliable channel; DYLD_FALLBACK_LIBRARY_PATH is a best-effort backup).
[tool.cibuildwheel.macos.environment]
CMAKE_PREFIX_PATH = "$PWD/vcpkg_installed/active:$PWD/.ortools"
ortools_DIR = "$PWD/.ortools/lib/cmake/ortools"
LIBRARY_PATH = "$PWD/vcpkg_installed/active/lib:$PWD/.ortools/lib"
CPATH = "$PWD/vcpkg_installed/active/include:$PWD/.ortools/include"
CMAKE_ARGS = "-DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON"
DYLD_FALLBACK_LIBRARY_PATH = "$PWD/vcpkg_installed/active/lib:$PWD/.ortools/lib"

[tool.cibuildwheel.linux]
before-all = "bash {project}/packaging/ci/before_all_linux.sh {project}"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# Bundle the slim GDAL/GEOS/PROJ closure; EXCLUDE the OR-Tools closure (resolved
# at runtime from the pip `ortools` wheel via the $ORIGIN/../ortools/.libs
# RUNPATH). No SIP on Linux, so LD_LIBRARY_PATH (below) reliably lets auditwheel
# resolve the GDAL libs it bundles. --exclude takes SONAME globs.
repair-wheel-command = "auditwheel repair --exclude 'libortools*' --exclude 'libabsl*' --exclude 'libprotobuf*' --exclude 'libprotoc*' --exclude 'libre2*' --exclude 'libutf8*' --exclude 'libscip*' --exclude 'libsoplex*' --exclude 'libhighs*' --exclude 'libCbc*' --exclude 'libCgl*' --exclude 'libClp*' --exclude 'libCoinUtils*' --exclude 'libOsi*' -w {dest_dir} {wheel}"

# Container paths (project is bind-mounted; $PWD is the build dir). LD_LIBRARY_PATH
# lets auditwheel find the vcpkg GDAL libs; VCPKG_DEFAULT_BINARY_CACHE points at a
# project-relative dir so the host actions/cache step can persist vcpkg builds.
[tool.cibuildwheel.linux.environment]
CMAKE_PREFIX_PATH = "$PWD/vcpkg_installed/active:$PWD/.ortools"
ortools_DIR = "$PWD/.ortools/lib/cmake/ortools"
LIBRARY_PATH = "$PWD/vcpkg_installed/active/lib:$PWD/.ortools/lib"
LD_LIBRARY_PATH = "$PWD/vcpkg_installed/active/lib:$PWD/.ortools/lib"
VCPKG_DEFAULT_BINARY_CACHE = "$PWD/.vcpkg-bincache"
